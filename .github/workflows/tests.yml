name: Interview Copilot tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install application and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Compile Python
        run: python -m compileall -q .

      - name: Run unit, integration, regression, and smoke tests
        run: python -m unittest discover -s tests -v

      - name: Lint correctness errors
        run: python -m ruff check --select F,E7,E9 .

      - name: Measure coverage
        run: |
          python -m coverage run --source=audio_processing,main,run_app,wboxai_app,llm_project -m unittest discover -s tests
          python -m coverage report -m
