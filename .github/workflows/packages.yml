name: Build desktop packages

on:
  workflow_dispatch:
  push:
    branches: ["fix/runtime-recovery"]
    tags: ["v*"]

concurrency:
  group: desktop-packages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            file: Interview-Copilot.exe
          - runner: macos-26
            file: Interview-Copilot.dmg
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt pyinstaller
      - if: runner.os == 'macOS'
        run: |
          swiftc -target arm64-apple-macos14.0 -parse-as-library packaging/macos_audio.swift -o "$RUNNER_TEMP/interview-copilot-audio"
          echo "COPILOT_MAC_AUDIO_HELPER=$RUNNER_TEMP/interview-copilot-audio" >> "$GITHUB_ENV"
      - run: python -m PyInstaller --clean --noconfirm --distpath "${{ runner.temp }}/copilot-dist" --workpath "${{ runner.temp }}/copilot-build" packaging/main.spec
      - name: Test the packaged Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $folder = Join-Path $env:RUNNER_TEMP ("Copilot Release " + [char]0x03A9 + " " + [guid]::NewGuid())
          New-Item -ItemType Directory -Path $folder | Out-Null
          $env:COPILOT_PACKAGE_TEST_PROFILE = Join-Path $folder "Clean Profile"
          $exe = Join-Path $folder "Interview-Copilot.exe"
          Copy-Item "$env:RUNNER_TEMP/copilot-dist/Interview-Copilot.exe" $exe
          try {
            $app = Start-Process -FilePath $exe -WorkingDirectory $folder -ArgumentList "--package-e2e-test" -PassThru
            $timedOut = -not $app.WaitForExit(75000)
            if ($timedOut) {
              $app.Kill($true)
              $app.WaitForExit()
            }
            $diagnostics = Join-Path $env:COPILOT_PACKAGE_TEST_PROFILE "Interview Copilot/package-diagnostics.log"
            if (Test-Path $diagnostics) { Get-Content -Encoding utf8 $diagnostics }
            if ($timedOut) { throw "Windows package regression timed out" }
            $report = Join-Path $env:COPILOT_PACKAGE_TEST_PROFILE "Interview Copilot/package-smoke.log"
            if (Test-Path $report) { Get-Content -Encoding utf8 $report }
            if ($app.ExitCode -ne 0) { throw "Windows package regression exited with code $($app.ExitCode)" }
            if (-not (Test-Path $report)) { throw "Missing Windows package regression report" }
            $env:LOCALAPPDATA = $env:COPILOT_PACKAGE_TEST_PROFILE
            $relaunch = Start-Process -FilePath $exe -WorkingDirectory $folder -ArgumentList "--package-smoke-test", "--expect-saved-key" -PassThru
            if (-not $relaunch.WaitForExit(60000)) {
              $relaunch.Kill($true)
              $relaunch.WaitForExit()
              throw "Windows package relaunch timed out"
            }
            if ($relaunch.ExitCode -ne 0) { throw "Windows package relaunch failed" }
          } finally {
            Remove-Item -LiteralPath $folder -Recurse -Force
          }
      - if: runner.os == 'macOS'
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          "$RUNNER_TEMP/copilot-dist/Interview Copilot.app/Contents/MacOS/Interview Copilot" --package-smoke-test
      - if: runner.os == 'macOS'
        run: |
          mkdir "$RUNNER_TEMP/dmg-content"
          ditto "$RUNNER_TEMP/copilot-dist/Interview Copilot.app" "$RUNNER_TEMP/dmg-content/Interview Copilot.app"
          ln -s /Applications "$RUNNER_TEMP/dmg-content/Applications"
          hdiutil create -volname "Interview Copilot" -srcfolder "$RUNNER_TEMP/dmg-content" -format UDZO "$RUNNER_TEMP/copilot-dist/Interview-Copilot.dmg"
          hdiutil verify "$RUNNER_TEMP/copilot-dist/Interview-Copilot.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.file }}
          path: ${{ runner.temp }}/copilot-dist/${{ matrix.file }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: assets
      - run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes assets/Interview-Copilot.exe assets/Interview-Copilot.dmg
        env:
          GH_TOKEN: ${{ github.token }}
